# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Build Jekyll after Maven success

on:
  # Запускается только после успешного завершения Maven workflow
  workflow_run:
    workflows: [ "Final Certification" ]
    types:
      - completed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # выполняется только если предыдущий workflow прошел успешно
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: ✅ Notify success
        if: ${{ success() }}
        run: |
          echo "### ✅ Сайт успешно собран и опубликован через GitHub Pages 🎉" >> $GITHUB_STEP_SUMMARY
          echo "Посмотри результат в разделе **Pages build and deployment**." >> $GITHUB_STEP_SUMMARY